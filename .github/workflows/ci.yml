name: CI
on:
  pull_request:
  push:
    branches: [main, 'app-*']
permissions:
  contents: read
jobs:
  validate:
    name: Question validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python contracts/validate.py
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements.txt
      - name: Test available modules
        shell: bash
        run: |
          modules=()
          for module in api engine pipeline; do
            if [ -d "$module" ]; then modules+=("$module"); fi
          done
          pytest "${modules[@]}"
  app:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
  browser:
    name: Phone and desktop flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm test
        working-directory: app
  container:
    name: Container build and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t daily-commit:ci .
      - name: Start the production image
        run: docker run --detach --name daily-commit-ci -p 127.0.0.1:8000:8000 -e DEMO_MODE=1 -v daily-commit-ci-data:/data daily-commit:ci
      - name: Check API and built app
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/ --output /tmp/daily-commit.html
          test -s /tmp/daily-commit.html
      - if: always()
        run: docker logs daily-commit-ci || true
      - if: always()
        run: docker rm -f daily-commit-ci || true

